services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-commerceiq}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-commerceiq_local_dev}
      POSTGRES_DB: ${POSTGRES_DB:-commerceiq}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - commerceiq_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-commerceiq} -d ${POSTGRES_DB:-commerceiq}"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  commerceiq_postgres:
