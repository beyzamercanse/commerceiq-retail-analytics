name: CI
on:
  push:
  pull_request:

jobs:
  python-and-warehouse:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: commerceiq
          POSTGRES_PASSWORD: commerceiq_ci
          POSTGRES_DB: commerceiq
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U commerceiq -d commerceiq"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://commerceiq:commerceiq_ci@localhost:5432/commerceiq
      DBT_HOST: localhost
      DBT_PORT: "5432"
      DBT_USER: commerceiq
      DBT_PASSWORD: commerceiq_ci
      DBT_DATABASE: commerceiq
      DBT_SCHEMA: analytics
      DBT_PROFILES_DIR: analytics
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -e '.[dev,dashboard]' 'dbt-postgres>=1.9,<2'
      - name: Lint Python and dashboard
        run: ruff check .
      - name: Python unit tests
        run: pytest
      - name: PostgreSQL ingestion integration
        run: pytest -o addopts= -m integration
      - name: Ingest sample CSVs
        run: commerceiq ingest --data-dir data/sample_olist --strict
      - name: Verify dbt connection and compilation
        run: dbt debug --project-dir analytics && dbt compile --project-dir analytics
      - name: Build and test warehouse
        run: dbt build --project-dir analytics
      - name: Run audited refresh (must skip 9 unchanged source files)
        run: commerceiq-refresh --data-dir data/sample_olist
      - name: Test reporting results and dashboard rendering
        run: pytest -o addopts= -m reporting
      - name: Verify dbt documentation
        run: dbt docs generate --project-dir analytics
