name: CI
on:
  push:
  pull_request:

jobs:
  python-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: commerceiq
          POSTGRES_PASSWORD: commerceiq_ci
          POSTGRES_DB: commerceiq
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U commerceiq -d commerceiq"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://commerceiq:commerceiq_ci@localhost:5432/commerceiq
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -e '.[dev]'
      - name: Lint
        run: ruff check .
      - name: Unit tests
        run: pytest
      - name: Database integration test
        run: pytest -o addopts= -m integration
